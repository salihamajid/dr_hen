# Render Blueprint — see https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render: New > Blueprint > select the repo.
#
# Only the web service is defined here — no Postgres database, since Render's
# managed Postgres has no free tier (minimum ~$10.50/month: instance + disk).
# DATABASE_URL instead points at a free external Postgres (e.g. neon.tech) —
# just a standard connection string, Prisma doesn't care who hosts it.

services:
  - type: web
    name: dr-hen
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon (or other) Postgres connection string here

      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # set manually in the Render dashboard — never commit real keys
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      # Flip to "meta" once real WhatsApp Cloud API credentials are set below.
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      - key: TRANSCRIBE_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false

      # Set to "false" once real WhatsApp is live, so the demo simulate panel/
      # route is hidden in production next to real farmer conversations.
      - key: DEMO_MODE
        value: "true"

      - key: INTRO_VIDEO_URL
        value: /videos/intro-demo.mp4
