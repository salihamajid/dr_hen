# Render Blueprint — see https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render: New > Blueprint > select the repo.
#
# Only the web service is defined here — no Postgres database, since Render's
# managed Postgres has no free tier (minimum ~$10.50/month: instance + disk).
# DATABASE_URL instead points at a free external Postgres (e.g. neon.tech) —
# just a standard connection string, Prisma doesn't care who hosts it.

services:
  - type: web
    name: dr-hen
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon (or other) Postgres connection string here (pooled, "-pooler" host)
      - key: DIRECT_URL
        sync: false # Neon's non-pooled connection string — required by `prisma migrate deploy` (pooled connections can't hold its advisory lock)

      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # set manually in the Render dashboard — never commit real keys
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      # Real WhatsApp Cloud API — credentials are set below.
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      - key: TRANSCRIBE_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false

      # Set to "false" once real WhatsApp is live, so the demo simulate panel/
      # route is hidden in production next to real farmer conversations.
      - key: DEMO_MODE
        value: "true"

      # Intro video message initiates contact with a farmer who's never
      # messaged Dr. Hen — WhatsApp requires an approved Message Template for
      # that (freeform video only works within an open 24h session window).
      # Create + get the template approved in Meta's WhatsApp Manager first.
      - key: INTRO_VIDEO_TEMPLATE_NAME
        value: dr_hen_intro
      - key: INTRO_VIDEO_TEMPLATE_LANGUAGE
        value: en_US # must exactly match the template's approved language in WhatsApp Manager ("en" != "en_US" to Meta's API)
      - key: INTRO_VIDEO_MEDIA_ID
        sync: false # preferred: a Meta Media API id, doesn't depend on this app being awake
      - key: INTRO_VIDEO_URL
        value: https://dr-hen.onrender.com/videos/intro-demo.mp4 # only used if INTRO_VIDEO_MEDIA_ID is unset
