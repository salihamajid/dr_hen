# Render Blueprint — see https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render: New > Blueprint > select the repo.
# Render reads this file and provisions both resources below in one step.

databases:
  - name: dr-hen-db
    databaseName: drhen
    user: drhen
    # Pick a plan in the Render dashboard during blueprint setup (availability/
    # naming of the free Postgres tier changes over time — not hardcoded here).

services:
  - type: web
    name: dr-hen
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    # Runs after buildCommand, before startCommand — the right place for
    # migrations, since it runs against the real target DB right before traffic
    # switches over.
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dr-hen-db
          property: connectionString

      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # set manually in the Render dashboard — never commit real keys
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      # Flip to "meta" once real WhatsApp Cloud API credentials are set below.
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      - key: TRANSCRIBE_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false

      # Set to "false" once real WhatsApp is live, so the demo simulate panel/
      # route is hidden in production next to real farmer conversations.
      - key: DEMO_MODE
        value: "true"

      - key: INTRO_VIDEO_URL
        value: /videos/intro-demo.mp4
